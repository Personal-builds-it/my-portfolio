
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #172554;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
        }

        h1 {
            font-size: 120px;
            color: #2454D6;
            line-height: 1.2;
        }

        h2 {
            font-size: 28px;
            margin: 15px 0;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            background: #2454D6;
            color: white;
            text-decoration: none;
            padding: 13px 28px;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background: #173da8;
        }

        @media(max-width: 500px) {
            h1 {
                font-size: 90px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>404</h1>

        <h2>Oops! Page Not Found.</h2>

        <p>
            The page you're looking for might have been removed,
            renamed, or is temporarily unavailable.
            Don't worry, let's get you back on track.
        </p>

        <a href="index.html">Back to Homepage</a>

    </div>

</body>
</html>
